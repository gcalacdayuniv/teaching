<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Teaching Portal</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    
    <link rel="stylesheet" href="./styles.css" />
</head>
<body class="bg-gray-50 font-sans h-screen flex flex-col overflow-hidden relative text-gray-800">

    <div id="overlay-container"></div>

    <div id="app-shell" class="hidden h-full flex-col w-full">
        
        <nav class="bg-blue-800 text-white p-4 flex items-center justify-between shadow-md z-40 relative flex-shrink-0">
            <div class="flex items-center space-x-4">
                <button id="toggle-sidebar-btn" class="text-2xl focus:outline-none hover:text-blue-200 transition">
                    <i class="fas fa-bars"></i>
                </button>
                <h1 class="text-xl font-bold tracking-wide">Teaching Portal</h1>
            </div>
            <div class="flex items-center space-x-2">
                <span id="navUserName" class="hidden sm:block text-sm font-medium text-blue-100"></span>
                <img id="navAvatar" src="" alt="Profile" class="w-8 h-8 rounded-full border-2 border-blue-400 object-cover bg-white">
            </div>
        </nav>

        <div id="sidebar" class="fixed inset-y-0 left-0 w-64 bg-white shadow-2xl transform -translate-x-full transition-transform duration-300 z-[60] pt-20 flex flex-col justify-between">
            <div class="flex flex-col p-4 space-y-2">
                <a href="#/log" class="nav-link w-full text-left p-3 rounded-lg hover:bg-blue-50 text-blue-900 font-medium transition border border-transparent">
                    <i class="fas fa-pen-to-square w-6 text-center text-blue-600"></i> Log Session
                </a>
                <a href="#/records" class="nav-link w-full text-left p-3 rounded-lg hover:bg-blue-50 text-blue-900 font-medium transition border border-transparent">
                    <i class="fas fa-table-list w-6 text-center text-blue-600"></i> View Records
                </a>
                <a href="#/resources" class="nav-link w-full text-left p-3 rounded-lg hover:bg-blue-50 text-blue-900 font-medium transition border border-transparent">
                    <i class="fas fa-folder-open w-6 text-center text-blue-600"></i> Resource Links
                </a>
                <hr class="my-2 border-gray-200">
                <a href="#/profile" class="nav-link w-full text-left p-3 rounded-lg hover:bg-gray-100 text-gray-700 font-medium transition">
                    <i class="fas fa-user-cog w-6 text-center text-gray-500"></i> Settings & Profile
                </a>
            </div>
            <div class="p-4">
                <button id="logout-btn" class="w-full bg-red-50 text-red-600 p-3 rounded-lg hover:bg-red-100 font-bold transition text-sm">
                    <i class="fas fa-sign-out-alt mr-2"></i> Log Out
                </button>
            </div>
        </div>
        
        <div id="sidebarOverlay" class="fixed inset-0 bg-gray-900 bg-opacity-50 hidden z-[55] transition-opacity"></div>

        <main id="main-view" class="flex-1 overflow-x-hidden overflow-y-auto p-3 sm:p-6 w-full relative custom-scrollbar">
            </main>
    </div>

    <datalist id="uniList"></datalist>
    <datalist id="colList"></datalist>
    <datalist id="subList"></datalist>

    <script type="module" src="./app.js"></script>
</body>
</html>
