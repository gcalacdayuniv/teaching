<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="icon" href="data:;base64,iVBORw0KGgo=">
    <title>Professional Portal</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    <link rel="stylesheet" href="./styles.css" />
</head>
<body class="bg-gray-50 font-sans h-[100dvh] flex flex-col overflow-hidden relative text-gray-800">

    <div id="overlay-container"></div>

    <div id="app-shell" class="hidden h-full flex-col w-full relative">
        
        <header class="bg-blue-800 text-white shadow-md z-40 flex-shrink-0 w-full min-w-0">
            <div class="flex justify-between items-center px-4 h-14 w-full min-w-0">
                <div class="flex items-center gap-3 shrink-0">
                    <h1 class="text-xl font-bold tracking-wide truncate" id="appTitle">Professional Portal</h1>
                </div>
                <button onclick="window.toggleAccountMenu()" class="flex items-center gap-2 hover:bg-blue-700 px-2 py-1 rounded-lg transition focus:outline-none min-w-0 shrink-0">
                    <span id="navUserName" class="font-medium text-sm text-blue-100 truncate max-w-[100px]">User</span>
                    <img id="navAvatar" src="" class="w-8 h-8 rounded-full border-2 border-blue-400 object-cover bg-white shrink-0">
                </button>
            </div>
        </header>

        <div id="menuBackdrop" class="hidden fixed inset-0 bg-gray-900/50 backdrop-blur-sm z-[90] transition-opacity" onclick="window.closeAllMenus()"></div>

        <aside id="accountMenu" class="fixed inset-y-0 right-0 w-[75%] sm:w-72 bg-white shadow-2xl transform translate-x-full transition-transform duration-300 ease-in-out z-[100] flex flex-col">
            <div class="bg-gray-50 p-5 flex flex-col items-center border-b border-gray-200 relative">
                <button onclick="window.toggleAccountMenu()" class="absolute top-3 left-3 text-gray-400 hover:text-gray-700">
                    <i class="fas fa-times text-xl"></i>
                </button>
                <div class="relative cursor-pointer group mb-2" onclick="window.location.hash='#/profile'; window.closeAllMenus();">
                    <img id="menuAvatar" src="" class="w-20 h-20 rounded-full border-2 border-white shadow-sm object-cover bg-white">
                </div>
                <h2 id="menuName" class="text-lg font-bold text-gray-900 text-center w-full truncate px-2"></h2>
            </div>
            
            <nav class="flex-1 overflow-y-auto py-3">
                <div class="px-5 mb-1 text-[10px] font-bold text-gray-400 uppercase tracking-wider">Settings</div>
                <ul class="space-y-1 px-2 text-sm font-semibold text-gray-700">
                    <li>
                        <a href="#/profile" onclick="window.closeAllMenus()" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-gray-50 transition">
                            <i class="fas fa-user-cog w-5 text-center text-gray-500"></i> Update Profile
                        </a>
                    </li>
                    <li>
                        <button onclick="window.openImportDbModal(); window.closeAllMenus()" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-gray-50 transition text-left">
                            <i class="fas fa-database w-5 text-center text-gray-500"></i> Import Databases
                        </button>
                    </li>
                    <li>
                        <button onclick="window.openChangePasswordModal(); window.closeAllMenus()" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-gray-50 transition text-left">
                            <i class="fas fa-key w-5 text-center text-gray-500"></i> Change Password
                        </button>
                    </li>
                </ul>
            </nav>
            
            <div class="p-3 border-t border-gray-100 bg-gray-50">
                <button id="logout-btn" class="w-full bg-red-50 hover:bg-red-100 text-red-600 font-bold py-2 rounded-lg transition border border-red-100 shadow-sm flex items-center justify-center gap-2 text-sm">
                    <i class="fas fa-sign-out-alt"></i> Sign Out
                </button>
            </div>
        </aside>

        <main id="main-view" class="flex-1 overflow-x-hidden overflow-y-auto p-3 sm:p-6 w-full relative custom-scrollbar pb-24"></main>

        <div id="bottomNavContainer" class="fixed bottom-4 left-1/2 transform -translate-x-1/2 z-50 flex flex-col items-center w-full max-w-md px-2 sm:px-4 pointer-events-none">
            
            <div id="fabMenu" class="hidden flex-col gap-2 items-center transition-opacity pointer-events-auto w-full px-5" style="margin-bottom: calc(22px + 4px);">
                
                <a href="#/log" onclick="window.toggleFAB()" class="w-full justify-center bg-white text-blue-700 shadow-xl border border-gray-100 px-4 py-2.5 rounded-xl font-bold flex items-center gap-2 hover:bg-blue-50 text-xs transition-colors">
                    <i class="fas fa-pen-to-square"></i> Log Teaching Load
                </a>
                
                <button onclick="window.FinanceManager?.openRecordForm(); window.toggleFAB();" class="w-full justify-center bg-white text-blue-700 shadow-xl border border-gray-100 px-4 py-2.5 rounded-xl font-bold flex items-center gap-2 hover:bg-blue-50 text-xs transition-colors">
                    <i class="fas fa-wallet"></i> Log Transaction
                </button>

                <button onclick="window.openResourceModal(); window.toggleFAB();" class="w-full justify-center bg-white text-blue-700 shadow-xl border border-gray-100 px-4 py-2.5 rounded-xl font-bold flex items-center gap-2 hover:bg-blue-50 text-xs transition-colors">
                    <i class="fas fa-link"></i> Add Resource Link
                </button>
            </div>

            <div class="relative flex items-center justify-between bg-white/95 backdrop-blur-xl px-1 sm:px-2.5 rounded-[2.5rem] shadow-[0_8px_30px_rgb(0,0,0,0.12)] border border-gray-200 pointer-events-auto w-full min-w-0" style="height: 48px;">
                
                <a href="#/records" id="menu-records" class="menu-link flex-1 min-w-0 flex justify-center items-center gap-1 sm:gap-1.5 px-1 sm:px-2 rounded-full text-[10px] sm:text-xs font-semibold transition-all duration-300 text-gray-500 hover:bg-blue-50 hover:text-blue-700 h-9">
                    <i class="fas fa-table-list shrink-0"></i> <span class="truncate">Records</span>
                </a>

                <a href="#/finance" id="menu-finance" class="menu-link flex-1 min-w-0 flex justify-center items-center gap-1 sm:gap-1.5 px-1 sm:px-2 rounded-full text-[10px] sm:text-xs font-semibold transition-all duration-300 text-gray-500 hover:bg-blue-50 hover:text-blue-700 h-9">
                    <i class="fas fa-chart-line shrink-0"></i> <span class="truncate">Finance</span>
                </a>

                <div class="shrink-0 mx-0.5 sm:mx-1 relative z-10 pointer-events-none" style="height: 80px; display: flex; align-items: center;">
                    <button onclick="window.toggleFAB()" id="fabBtn" class="bg-white hover:bg-gray-50 text-blue-600 rounded-full shadow-[0_4px_20px_rgb(0,0,0,0.15)] border border-gray-200 transform transition-transform focus:outline-none pointer-events-auto" style="width: 50px; height: 50px; display: flex; align-items: center; justify-content: center; margin-bottom: 22px;">
                        <i id="fabIcon" class="fas fa-plus text-lg sm:text-xl transition-transform duration-300"></i>
                    </button>
                </div>

                <a href="#/resources" id="menu-resources" class="menu-link flex-1 min-w-0 flex justify-center items-center gap-1 sm:gap-1.5 px-1 sm:px-2 rounded-full text-[10px] sm:text-xs font-semibold transition-all duration-300 text-gray-500 hover:bg-blue-50 hover:text-blue-700 h-9">
                    <i class="fas fa-folder-open shrink-0"></i> <span class="truncate">Resources</span>
                </a>

                <button onclick="window.toggleAccountMenu()" id="menu-profile" class="flex-1 min-w-0 flex justify-center items-center gap-1 sm:gap-1.5 px-1 sm:px-2 rounded-full text-[10px] sm:text-xs font-semibold transition-all duration-300 text-gray-500 hover:bg-blue-50 hover:text-blue-700 h-9 focus:outline-none">
                    <i class="fas fa-user-circle shrink-0"></i> <span class="truncate">Profile</span>
                </button>
            </div>
        </div>

        <div id="importDbModal" class="hidden fixed inset-0 bg-gray-900/50 backdrop-blur-sm z-[110] justify-center items-center p-4">
            <div class="bg-white rounded-2xl shadow-xl w-full max-w-md overflow-hidden flex flex-col max-h-[90vh]">
                <div class="p-4 border-b border-gray-100 flex justify-between items-center bg-gray-50">
                    <h3 class="font-bold text-gray-800">Import Databases</h3>
                    <button onclick="window.closeProfileModals()" class="text-gray-400 hover:text-gray-600"><i class="fas fa-times"></i></button>
                </div>
                <div class="p-4 overflow-y-auto">
                    <form id="addImportDbForm" class="flex flex-col gap-3 mb-6">
                        <div>
                            <label class="text-xs font-bold text-gray-500 mb-1 block">Project Name</label>
                            <input type="text" id="importDbName" class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-blue-500" placeholder="e.g. Q1 Finance DB">
                        </div>
                        <div>
                            <label class="text-xs font-bold text-gray-500 mb-1 block">API URL</label>
                            <input type="url" id="importDbUrl" required class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-blue-500" placeholder="https://api.example.com/data">
                        </div>
                        <button type="submit" id="addImportDbBtn" class="bg-blue-600 text-white font-bold py-2 rounded-lg text-sm hover:bg-blue-700 transition">Import Database</button>
                    </form>
                    
                    <h4 class="text-xs font-bold text-gray-500 mb-2 uppercase tracking-wide">Saved Databases</h4>
                    <div id="importedDbList" class="flex flex-col gap-2">
                        </div>
                </div>
            </div>
        </div>
    </div>

    <datalist id="uniList"></datalist>
    <datalist id="colList"></datalist>
    <datalist id="subList"></datalist>

    <script type="module" src="./js/app.js"></script>
</body>
</html>
