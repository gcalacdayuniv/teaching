<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teaching Load Management</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="manifest.json">
    
</head>
<body>
    <div id="app">
        <header>
            <h1>Teaching Load Tracker</h1>
        </header>

        <main>
            <section id="log-teaching-load-container">
                <h2>Log Teaching Load</h2>
                <form id="logForm">
                    <div class="form-control">
                        <label for="date">Date</label>
                        <input type="date" id="date" name="date" required>
                    </div>
                    
                    <div class="form-control">
                        <label for="hours">Hours</label>
                        <input type="number" id="hours" name="hours" step="0.5" min="0.5" required>
                    </div>

                    <div class="form-control">
                        <label for="rate">Rate per hour</label>
                        <input type="number" id="rate" name="rate" step="0.01" required>
                    </div>

                    <button type="submit">Submit Teaching Load</button>
                </form>
            </section>

            <section id="batch-teaching-load-container">
                <h2>Batch Teaching Load</h2>
                <form id="batchForm">
                    <div class="form-control">
                        <label for="batchData">Upload Teaching Load CSV</label>
                        <input type="file" id="batchData" name="batchData" accept=".csv" required>
                    </div>

                    <button type="submit">Upload Batch Teaching Load</button>
                </form>
            </section>
        </main>
    </div>

    <script type="module" src="js/globals.js"></script>
    <script type="module" src="js/finance-utils.js"></script>
    <script type="module" src="js/finance-form.js"></script>
    <script type="module" src="js/app.js"></script>
</body>
</html>
