<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <title>Etch System</title>
    <meta name="theme-color" content="#4338ca">
    <meta name="description" content="Etch Signage Project and Ledger Management System">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Etch">
    <link rel="apple-touch-icon" href="https://www.etchsignage.com/icon-192x192.png">
    <link rel="icon" href="https://www.etchsignage.com/favicon.ico" type="image/x-icon">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-gray-100 text-gray-800 font-sans min-h-screen overflow-x-hidden text-sm">

    <div id="loadingOverlay" class="hidden fixed inset-0 bg-white/90 backdrop-blur-sm z-[9999] flex flex-col items-center justify-center">
        <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-indigo-600 mb-3"></div>
        <div id="loadingText" class="text-base font-bold text-gray-700">Processing...</div>
    </div>

    <div id="loginView" class="min-h-screen flex items-center justify-center p-4">
        <div class="bg-white p-6 rounded-xl shadow-xl w-full max-w-sm text-center border border-gray-100">
            <h2 class="text-xl font-bold text-gray-900 mb-1">System Login</h2>
            <p class="text-gray-500 mb-5 text-xs">Please enter your credentials.</p>
            <form id="loginForm" class="space-y-3">
                <input type="text" id="loginUser" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="Username, Email, or Contact No." autocomplete="username" required>
                <input type="password" id="loginPass" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="Password" autocomplete="current-password" required>
                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 rounded-lg transition shadow-md">Secure Login</button>
            </form>
            <div id="loginFeedback" class="text-red-500 mt-3 text-xs font-semibold"></div>
        </div>
    </div>

    <div id="appView" class="hidden flex flex-col h-screen w-full relative">

        <header class="bg-indigo-700 text-white shadow-md z-40 sticky top-0">
            <div class="flex justify-between items-center px-4 h-14 w-full">
                <div class="flex items-center gap-3">
                    <img id="headerLogo1" src="" class="h-7 w-7 object-cover rounded-full border border-white/30" alt="Logo">
                    <h1 class="font-black text-base tracking-tight" id="appTitle">Records</h1>
                </div>
                <button onclick="toggleAccountMenu()" class="flex items-center gap-2 hover:bg-indigo-600 px-2 py-1 rounded-lg transition focus:outline-none">
                    <span id="displayUserName" class="font-bold text-sm">User</span>
                    <img id="headerAvatar" src="" class="w-8 h-8 rounded-full border border-indigo-400 object-cover bg-white">
                </button>
            </div>
        </header>

        <div id="menuBackdrop" class="hidden fixed inset-0 bg-gray-900/50 backdrop-blur-sm z-[90] transition-opacity" onclick="closeAllMenus()"></div>

        <aside id="accountMenu" class="fixed inset-y-0 right-0 w-[75%] sm:w-72 bg-white shadow-2xl transform translate-x-full transition-transform duration-300 ease-in-out z-[100] flex flex-col">
            <div class="bg-gray-50 p-5 flex flex-col items-center border-b border-gray-200 relative">
                <button onclick="toggleAccountMenu()" class="absolute top-3 left-3 text-gray-400 hover:text-gray-700">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
                <div class="relative cursor-pointer group mb-2" onclick="openFSModal('uploadAvatarModal')">
                    <img id="menuAvatar" src="" class="w-20 h-20 rounded-full border-2 border-white shadow-sm object-cover bg-white">
                    <div class="absolute inset-0 bg-black/40 rounded-full flex items-center justify-center opacity-0 group-hover:opacity-100 transition">
                        <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path></svg>
                    </div>
                </div>
                <h2 id="menuName" class="text-lg font-bold text-gray-900">User Name</h2>
                <p id="menuEmail" class="text-xs text-gray-500">user@email.com</p>
            </div>
            <nav class="flex-1 overflow-y-auto py-3">
                <div class="px-5 mb-1 text-[10px] font-bold text-gray-400 uppercase tracking-wider">Settings</div>
                <ul class="space-y-1 px-2 text-sm font-semibold text-gray-700">
                    <li><button onclick="openFSModal('updateProfileModal')" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-gray-50 transition"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>Update Details</button></li>
                    <li><button onclick="openFSModal('updatePasswordModal')" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-gray-50 transition"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>Change Password</button></li>
                </ul>
            </nav>
            <div class="p-3 border-t border-gray-100 bg-gray-50">
                <button onclick="logout()" class="w-full bg-red-50 hover:bg-red-100 text-red-600 font-bold py-2 rounded-lg transition border border-red-100 shadow-sm flex items-center justify-center gap-2 text-sm">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                    Sign Out
                </button>
            </div>
        </aside>

        <main class="flex-1 overflow-y-auto p-3 sm:p-5 w-full bg-gray-100">
            <div class="max-w-6xl mx-auto w-full pb-40">
                
                <div id="recordsView" class="app-view block">
                    <div class="flex items-center justify-between mb-3 ml-1">
                        <h2 class="text-sm font-bold text-gray-800">My Records</h2>
                    </div>
                    <div id="recordsContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                        <div class="text-gray-500 text-sm">Loading records...</div>
                    </div>
                </div>

                <div id="resourcesView" class="app-view hidden">
                    <div class="flex items-center justify-between mb-3 ml-1">
                        <h2 class="text-sm font-bold text-gray-800">Resource Links</h2>
                    </div>
                    <div id="resourcesContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                         <div class="text-gray-500 text-sm">Loading resources...</div>
                    </div>
                </div>

            </div>
        </main>

        <div id="bottomNavContainer" class="fixed bottom-4 left-1/2 transform -translate-x-1/2 z-50 flex flex-col items-center w-full max-w-md px-4 pointer-events-none">
            
            <div id="fabMenu" class="hidden flex-col gap-2 items-center transition-opacity pointer-events-auto w-full px-5" style="margin-bottom: calc(22px + 4px);">
                <button onclick="openFSModal('logSessionModal'); toggleFAB();" class="w-full justify-center bg-white text-indigo-700 shadow-xl border border-gray-100 px-4 py-2.5 rounded-xl font-bold flex items-center gap-2 hover:bg-indigo-50 text-xs transition-colors">
                    <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    Log Session
                </button>
                <button onclick="openFSModal('addResourceModal'); toggleFAB();" class="w-full justify-center bg-white text-indigo-700 shadow-xl border border-gray-100 px-4 py-2.5 rounded-xl font-bold flex items-center gap-2 hover:bg-indigo-50 text-xs transition-colors">
                    <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"></path></svg>
                    Add Resource Link
                </button>
            </div>

            <div class="relative flex items-center justify-between bg-white/95 backdrop-blur-xl px-2.5 rounded-[2.5rem] shadow-[0_8px_30px_rgb(0,0,0,0.12)] border border-gray-200 pointer-events-auto w-full" style="height: 48px;">
                <button onclick="navigateTo('/records')" id="menu-records" class="menu-link active-link bg-indigo-50 text-indigo-700 flex-1 flex justify-center items-center gap-1.5 px-3 rounded-full text-xs font-bold transition-all duration-300 h-9">
                    <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                    <span class="truncate">Records</span>
                </button>

                <div class="shrink-0 mx-2 relative z-10 pointer-events-none" style="height: 80px; display: flex; align-items: center;">
                    <button onclick="toggleFAB()" id="fabBtn" class="bg-white hover:bg-gray-50 text-indigo-600 rounded-full shadow-[0_4px_20px_rgb(0,0,0,0.15)] border border-gray-200 transform transition-transform focus:outline-none pointer-events-auto" style="width: 64px; height: 64px; display: flex; align-items: center; justify-content: center; margin-bottom: 22px;">
                        <svg id="fabIcon" class="w-7 h-7 transition-transform duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"></path></svg>
                    </button>
                </div>

                <button onclick="navigateTo('/resources')" id="menu-resources" class="menu-link flex-1 flex justify-center items-center gap-1.5 px-3 rounded-full text-xs font-semibold transition-all duration-300 text-gray-500 hover:bg-gray-100 h-9">
                    <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 19a2 2 0 01-2-2V7a2 2 0 012-2h4l2 2h4a2 2 0 012 2v1M5 19h14a2 2 0 002-2v-5a2 2 0 00-2-2H9a2 2 0 00-2 2v5a2 2 0 01-2 2z"></path></svg>
                    <span class="truncate">Resources</span>
                </button>
            </div>
        </div>
    </div>

    <script src="js/components.js"></script>
    <script src="js/globals.js"></script>
    <script src="js/router.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/resources.js"></script>
    <script src="js/records-viewer.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
